<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <style>
    body { background-color: #f4f4f4; margin: 0; padding: 0; font-family: sans-serif; }
    
    /* بنر مستقل در بالای صفحه */
    .hero-banner { 
      width: 100%; 
      height: 350px; 
      background-image: url('{{ '/assets/Banner.png' | relative_url }}'); 
      background-size: cover; 
      background-position: center; 
    }
    
    /* منو زیر بنر با رنگ اختصاصی پتروشیمی */
    .satco-nav { 
      background: #005f73; 
      padding: 15px 0; 
      text-align: center; 
    }
    .satco-nav a { 
      color: #ffffff; 
      margin: 0 20px; 
      text-decoration: none; 
      font-weight: 600; 
      font-size: 14px; 
      letter-spacing: 1px;
    }
    .satco-nav a:hover { color: #94d2bd; }

    /* محتوای سایت */
    .main-content { max-width: 1200px; margin: 30px auto; padding: 20px; background: white; border-radius: 5px; }
  </style>
</head>
<body>

  <div class="hero-banner"></div>

  <nav class="satco-nav">
    <a href="{{ '/' | relative_url }}">HOME</a>
    <a href="{{ '/petrochemicals.html' | relative_url }}">PETROCHEMICALS</a>
    <a href="{{ '/market-insights.html' | relative_url }}">MARKET INSIGHTS</a>
    <a href="{{ '/shipments.html' | relative_url }}">OUR SHIPMENTS</a>
    <a href="{{ '/contact.html' | relative_url }}">CONTACT US</a>
  </nav>

  <main class="main-content">
    {{ content }}
  </main>

</body>
</html>
